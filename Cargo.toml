[workspace]
resolver = "2"
members = [
    "crates/krl-core",
    "crates/krl-versions",
    "crates/krl-mods",
    "crates/krl-runtime",
    "crates/krl-bench",
    "crates/krl-storage",
    "crates/krl-android",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
